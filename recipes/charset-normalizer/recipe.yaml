{
  "$schema": "https://mobilestudio-androidide.github.io/MobileStudio-AndroidPython/schema/recipe-v1.json",
  "package": {
    "name": "charset-normalizer",
    "version": "3.5.2",
    "type": "pure-python",
    "category": "data",
    "description": "The Real First Universal Charset Detector",
    "homepage": "https://pypi.org/project/charset-normalizer/",
    "license": "MIT"
  },
  "source": {
    "url": "https://files.pythonhosted.org/packages/source/c/charset-normalizer/charset-normalizer-3.5.2.tar.gz",
    "sha256": "PLACEHOLDER"
  },
  "build": {
    "system": "pure-python",
    "host_python": "${ANDROID_PYTHON}/bin/python3.13",
    "android_abi": "arm64-v8a",
    "android_api": 28
  },
  "dependencies": [],
  "test": {
    "import": "charset_normalizer",
    "command": "python3.13 -c 'import charset_normalizer; print(charset_normalizer.__version__)'",
    "min_android_api": 28
  },
  "artifacts": {
    "wheel_pattern": "charset-normalizer-3.5.2-py3-none-any.whl"
  }
}
