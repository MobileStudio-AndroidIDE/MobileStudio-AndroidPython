{
  "$schema": "https://mobilestudio-androidide.github.io/MobileStudio-AndroidPython/schema/recipe-v1.json",
  "package": {
    "name": "setuptools",
    "version": "84.2.1",
    "type": "pure-python",
    "category": "build-tools",
    "description": "Easily download, build, install, upgrade, and uninstall Python packages",
    "homepage": "https://pypi.org/project/setuptools/",
    "license": "MIT"
  },
  "source": {
    "url": "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-84.2.1.tar.gz",
    "sha256": "PLACEHOLDER"
  },
  "build": {
    "system": "pure-python",
    "host_python": "${ANDROID_PYTHON}/bin/python3.13",
    "android_abi": "arm64-v8a",
    "android_api": 28
  },
  "dependencies": [],
  "test": {
    "import": "setuptools",
    "command": "python3.13 -c 'import setuptools; print(setuptools.__version__)'",
    "min_android_api": 28
  },
  "artifacts": {
    "wheel_pattern": "setuptools-84.2.1-py3-none-any.whl"
  }
}
